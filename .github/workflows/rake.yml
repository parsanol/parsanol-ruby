---
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-data:
    runs-on: ubuntu-22.04
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - id: fetch
        uses: oxidize-rb/actions/fetch-ci-data@v1
        with:
          stable-ruby-versions: |
            exclude: [head]

  ci:
    runs-on: ${{ matrix.os }}
    needs: ci-data
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (cache only on 3.4)
          - os: ubuntu-22.04
            ruby: "3.2"
            cargo-cache: "false"
          - os: ubuntu-22.04
            ruby: "3.3"
            cargo-cache: "false"
          - os: ubuntu-22.04
            ruby: "3.4"
            cargo-cache: true
          - os: ubuntu-22.04
            ruby: "4.0"
            cargo-cache: "false"

          # Linux ARM64
          - os: ubuntu-22.04-arm
            ruby: "3.2"
            cargo-cache: "false"
          - os: ubuntu-22.04-arm
            ruby: "3.3"
            cargo-cache: "false"
          - os: ubuntu-22.04-arm
            ruby: "3.4"
            cargo-cache: "false"
          - os: ubuntu-22.04-arm
            ruby: "4.0"
            cargo-cache: "false"

          # macOS Intel (cache only on 3.4)
          - os: macos-15-intel
            ruby: "3.2"
            cargo-cache: "false"
          - os: macos-15-intel
            ruby: "3.3"
            cargo-cache: "false"
          - os: macos-15-intel
            ruby: "3.4"
            cargo-cache: true
          - os: macos-15-intel
            ruby: "4.0"
            cargo-cache: "false"

          # macOS Apple Silicon (cache only on 3.4)
          - os: macos-15
            ruby: "3.2"
            cargo-cache: "false"
          - os: macos-15
            ruby: "3.3"
            cargo-cache: "false"
          - os: macos-15
            ruby: "3.4"
            cargo-cache: true
          - os: macos-15
            ruby: "4.0"
            cargo-cache: "false"

          # Windows x64 (cache only on 3.4)
          - os: windows-2025
            ruby: "3.2"
            cargo-cache: "false"
          - os: windows-2025
            ruby: "3.3"
            cargo-cache: "false"
          - os: windows-2025
            ruby: "3.4"
            cargo-cache: true
          - os: windows-2025
            ruby: "4.0"
            cargo-cache: "false"

          # NOTE: Windows ARM64 is disabled for CI (building from source) because
          # rb-sys lacks pre-built static libraries for aarch64-pc-windows-msvc.
          # Cross-compiled Windows ARM64 gems still work via gem-build.yml workflow.
    steps:
      - uses: actions/checkout@v4

      # The cross-engine conformance corpus lives in parsanol-rs
      # (corpus/conformance): the gate compiles each committed .parg and
      # replays every artifact's test section on both Ruby execution
      # modes (see spec/parsanol/parg/conformance_spec.rb).
      - uses: actions/checkout@v4
        with:
          repository: parsanol/parsanol-rs
          path: parsanol-rs

      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cargo-cache: ${{ matrix.cargo-cache }}
          # v2: the ext's own resolved lockfile froze parsanol at older
          # versions across lock rides, serving stale extensions that
          # masked and manufactured failures (rs#305 triage).
          cache-version: v2

      - name: Compile rust ext
        run: bundle exec rake compile

      - name: Run ruby tests
        run: bundle exec rspec spec/ --format progress
        env:
          PARG_CONFORMANCE_DIR: ${{ github.workspace }}/parsanol-rs/corpus/conformance

      - name: Run performance benchmarks
        if: matrix.os == 'ubuntu-22.04' && matrix.ruby == '3.4'
        run: bundle exec rspec spec/performance/native_benchmark_spec.rb --format documentation

  ext-lock-freshness:
    name: Ext lock freshness (crates.io)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The ext lock rides every rs release by hand: fail loudly (with
      # the fix) when crates.io has a newer parsanol than Cargo.lock —
      # the released gem must never ship a silently stale engine.
      - name: Compare Cargo.lock against crates.io
        run: |
          locked=$(grep -A1 '^name = "parsanol"' Cargo.lock | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/')
          latest=$(curl -sf https://crates.io/api/v1/crates/parsanol -H "User-Agent: parsanol-ruby-ci (github.com/parsanol)" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["crate"]["max_stable_version"]')
          echo "Cargo.lock pins rs parsanol $locked; crates.io latest is $latest"
          if [ "$locked" != "$latest" ]; then
            echo "::error::Cargo.lock pins rs parsanol $locked but crates.io has $latest. Ride it: cargo update -p parsanol, then commit the lock change."
            exit 1
          fi

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Lint ruby
        run: bundle exec rubocop

  clippy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          rustup-components: clippy
          cargo-cache: "false"

      - name: Lint rust
        run: |
          cd ext/parsanol_native
          cargo clippy --all-features -- -D warnings
          cargo fmt --check
