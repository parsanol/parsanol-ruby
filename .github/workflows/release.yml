---
name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type (use 'skip' to release existing version)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - pre
          - rc
          - beta
          - alpha
          - custom
          - skip
        default: "patch"
      custom_version:
        description: "Custom version (only used when bump_type is 'custom', e.g., 1.1.0, 1.1.0.rc.1)"
        required: false
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
  # Auto-release: a version bump landing on main IS the release
  # decision — ship it (the leptris-ruby#452 pattern). No tag trigger:
  # tags+paths in one push block is under-documented and can silently
  # break both; releases here go through dispatch or this trigger.
  push:
    branches:
      - main
    paths:
      - "lib/parsanol/version.rb"

# ONE release at a time — fixed group so a push-triggered run and a
# manual dispatch serialize (interpolated groups would let them race
# into a half-published gem), and a duplicate QUEUES behind an
# in-flight publish instead of cancelling it (the 1.9.359 lesson).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  # Version management job
  prepare-version:
    name: Prepare version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install gem-release
        run: gem install gem-release

      - name: Determine and bump version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Configure git identity (required for gem bump to create commits)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Empty bump_type = the auto-release trigger (a version bump
          # landing on main IS the release decision): read the version
          # already on main and ship it.
          if [ -z "${{ inputs.bump_type }}" ] || [ "${{ inputs.bump_type }}" = "skip" ]; then
            echo "release=true" >> $GITHUB_OUTPUT
            # Skip version bump - just read current version and create tag if needed
            echo "Skipping version bump, using current version..."
            VERSION=$(grep "VERSION =" lib/parsanol/version.rb | sed 's/.*"\([^"]*\)".*/\1/')
            SHA=$(git rev-parse HEAD)
            TAG="v$VERSION"

            # Check if tag already exists locally
            if git tag -l | grep -q "^${TAG}$"; then
              echo "Tag $TAG already exists locally"
            else
              echo "Creating tag $TAG..."
              git tag -a "$TAG" -m "Release $VERSION"
            fi
            # Outputs feed the tag push, the build checkouts and the
            # GitHub-release step — dropping them silently skips the
            # tag and reds the release step (the 1.3.95 train).
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "sha=$SHA" >> $GITHUB_OUTPUT
          else
            # Dispatch-bump: the version bump lands as a PR (main is
            # protected against direct pushes), auto-merge lands it once
            # the PR's CI is green, and THAT merge triggers this
            # workflow's push path — which publishes. This run only
            # prepares the bump; its publish jobs skip (release=false).
            echo "release=false" >> $GITHUB_OUTPUT
            if [ "${{ inputs.bump_type }}" = "custom" ]; then
              VERSION_ARG="${{ inputs.custom_version }}"
            else
              VERSION_ARG="${{ inputs.bump_type }}"
            fi

            BRANCH="release/bump-$VERSION_ARG-$(date +%s)"
            git checkout -b "$BRANCH"
            # Bump version using gem-release (creates the commit; the
            # tag is created by the merge-triggered run, from main).
            gem bump --version $VERSION_ARG
            VERSION=$(grep "VERSION =" lib/parsanol/version.rb | sed 's/.*"\([^"]*\)".*/\1/')
            git push origin "$BRANCH"

            {
              echo "Version bump to ${VERSION} for release (dispatched with bump_type=${{ inputs.bump_type }})."
              echo ""
              echo "Merging publishes: the merge triggers the release workflow's push path, which tags this commit and builds the platform gems."
            } > /tmp/bump-pr-body.md
            PR_URL=$(gh pr create \
              --title "Release: bump parsanol to ${VERSION}" \
              --body-file /tmp/bump-pr-body.md \
              --head "$BRANCH")
            echo "Bump PR: $PR_URL (auto-merge enabled; waiting for its CI + merge)"
            gh pr merge --auto --merge "$PR_URL"

            # Wait for the auto-merge to land. The merge's push cannot
            # trigger this workflow (GITHUB_TOKEN events are suppressed),
            # so this run continues the release itself: tag the merged
            # head and proceed downstream on the merge commit.
            PR_NUMBER=$(basename "$PR_URL")
            for i in $(seq 1 120); do
              STATE=$(gh pr view "$PR_NUMBER" --json state --jq .state)
              [ "$STATE" = "MERGED" ] && break
              [ "$STATE" = "CLOSED" ] && {
                echo "Bump PR was closed without merging"
                exit 1
              }
              sleep 30
            done
            [ "$STATE" = "MERGED" ] || {
              echo "Timed out waiting for the bump PR to merge (60m)"
              exit 1
            }

            git fetch origin main
            git checkout -q main
            git pull -q origin main
            SHA=$(git rev-parse HEAD)
            TAG="v${VERSION}"
            git tag -a "$TAG" -m "Release $VERSION" "$SHA"
            git push origin "$TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "sha=$SHA" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
          fi

      - name: Push version bump commit and tag
        run: |
          # Only needed when the version was not bumped by gem bump
          # (skip mode / auto-release: HEAD is already on main, only
          # the tag needs pushing)
          if [ -z "${{ inputs.bump_type }}" ] || [ "${{ inputs.bump_type }}" = "skip" ]; then
            git push origin HEAD:${{ github.ref_name }} || true
            git push origin ${{ steps.version.outputs.tag }}
          fi

  ci-data:
    runs-on: ubuntu-22.04
    needs: prepare-version
    if: needs.prepare-version.outputs.release == 'true'
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.sha }}

      # parsanol-ruby#205: the cross-gem build runs plain `cargo rustc`,
      # which re-resolves and rewrites the lock whenever the ext manifest's
      # floor outpaces the committed lock (shipped 1.3.53/1.3.54 embedded
      # rs crates 0.8.9/0.8.10 while their tags' locks said 0.8.8). Fail
      # early instead of silently floating the shipped engine.
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert the ext lock is consistent with the manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

      - id: fetch
        uses: oxidize-rb/actions/fetch-ci-data@v1
        with:
          supported-ruby-platforms: |
            exclude: [x64-mingw32]
          stable-ruby-versions: |
            only: [3.2, 3.3, 3.4, 4.0]

  build:
    name: Build native gems
    needs: [prepare-version, ci-data]
    if: needs.prepare-version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ruby-platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.sha }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: oxidize-rb/actions/cross-gem@v1
        env:
          PARSANOL_VENDOR_CDYLIB: "1"
        id: cross-gem
        with:
          platform: ${{ matrix.ruby-platform }}
          ruby-versions: "3.2,3.3,3.4,4.0"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.ruby-platform }}
          path: pkg/*-${{ matrix.ruby-platform }}.gem
          if-no-files-found: error

  # Ruby >= 3.2 (our floor) never shipped a legacy-MinGW build: the
  # newest x64-mingw32 Ruby is 3.0, which cannot run parsanol at all.
  # A native x64-mingw32 gem is therefore unbuildable; we publish a
  # lib-only platform stub so the platform matrix on RubyGems is
  # complete for resolvers. It installs the pure-Ruby engine.
  stub-x64-mingw32:
    name: Build stub gem (x64-mingw32)
    needs: prepare-version
    if: needs.prepare-version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.sha }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Build lib-only platform stub
        run: |
          ruby build_mingw32_stub.rb
          mkdir -p pkg
          mv parsanol-*-x64-mingw32.gem pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-x64-mingw32
          path: pkg/*-x64-mingw32.gem
          if-no-files-found: error

  # Smoke test Linux x86_64 gem

  smoke-linux:
    name: Smoke test Linux x86_64
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: actions/download-artifact@v4
        with:
          name: cross-gem-x86_64-linux
          path: pkg/

      - name: Install and test gem
        run: |
          gem install pkg/parsanol-*.gem --verbose
          ruby .github/scripts/test_installed_gem.rb

  # Smoke test Linux ARM64 gem
  smoke-linux-arm:
    name: Smoke test Linux ARM64
    needs: build
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: actions/download-artifact@v4
        with:
          name: cross-gem-aarch64-linux
          path: pkg/

      - name: Install and test gem
        run: |
          gem install pkg/parsanol-*.gem --verbose
          ruby .github/scripts/test_installed_gem.rb

  # Smoke test macOS Apple Silicon gem
  smoke-macos-arm:
    name: Smoke test macOS ARM64
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: actions/download-artifact@v4
        with:
          name: cross-gem-arm64-darwin
          path: pkg/

      - name: Install and test gem
        run: |
          gem install pkg/parsanol-*.gem --verbose
          ruby .github/scripts/test_installed_gem.rb

  # Smoke test macOS Intel gem
  smoke-macos-intel:
    name: Smoke test macOS x86_64
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: actions/download-artifact@v4
        with:
          name: cross-gem-x86_64-darwin
          path: pkg/

      - name: Install and test gem
        run: |
          gem install pkg/parsanol-*.gem --verbose
          ruby .github/scripts/test_installed_gem.rb

  # Smoke test Windows x64 gem
  smoke-windows:
    name: Smoke test Windows x64
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: actions/download-artifact@v4
        with:
          name: cross-gem-x64-mingw-ucrt
          path: pkg/

      - name: Install and test gem
        run: |
          gem install pkg/parsanol-*.gem --verbose
          ruby .github/scripts/test_installed_gem.rb

  # Smoke test Windows ARM64 gem
  smoke-windows-arm:
    name: Smoke test Windows ARM64
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: actions/download-artifact@v4
        with:
          name: cross-gem-aarch64-mingw-ucrt
          path: pkg/

      - name: Install and test gem
        run: |
          gem install pkg/parsanol-*.gem --verbose
          ruby .github/scripts/test_installed_gem.rb

  release:
    name: Release
    needs: [prepare-version, build, stub-x64-mingw32, smoke-linux, smoke-linux-arm, smoke-macos-arm, smoke-macos-intel, smoke-windows, smoke-windows-arm]
    if: needs.prepare-version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.sha }}
          fetch-depth: 0

      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
          cache-version: v1

      - uses: actions/download-artifact@v4
        with:
          pattern: cross-gem-*
          merge-multiple: true
          path: pkg/

      - name: Package source gem
        run: bundle exec rake gem:native:any

      - name: List built gems
        run: ls -la pkg/

      - name: Configure RubyGems credentials for Trusted Publishing
        uses: rubygems/configure-rubygems-credentials@main

      - name: Push Gem
        working-directory: pkg/
        run: |
          set +e  # Disable exit on error so we can capture and show errors
          echo "Using trusted publishing..."
          echo "Listing gems to push..."
          ls -l
          final_exit=0
          for i in *.gem; do
            if [ -f "$i" ]; then
              echo "Pushing $i..."
              gem push "$i" 2>&1 | tee push.out
              gemerr=${PIPESTATUS[0]}
              echo "gem push exit code: $gemerr"
              if [ "$gemerr" -ne 0 ]; then
                if ! grep -q "Repushing of gem" push.out; then
                  echo "::error::Failed to push $i (exit code: $gemerr)"
                  final_exit=$gemerr
                else
                  echo "Gem already pushed, continuing..."
                fi
              fi
            fi
          done
          exit $final_exit

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.prepare-version.outputs.tag }}
          allowUpdates: true
          generateReleaseNotes: true
          draft: ${{ inputs.draft == true || inputs.draft == 'true' }}
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          skipIfReleaseExists: true
          prerelease: ${{ contains(needs.prepare-version.outputs.version, 'rc') || contains(needs.prepare-version.outputs.version, 'pre') || contains(needs.prepare-version.outputs.version, 'beta') || contains(needs.prepare-version.outputs.version, 'alpha') }}
