[workspace]
resolver = "2"
members = ["ext/parsanol_native", "ext/parsanol_cdylib"]

[profile.release]
opt-level = 3
lto = "off"
codegen-units = 1
debug = true

# rb-sys is pinned to a git rev (daa12b65) that includes fixes not yet on
# crates.io. magnus 0.9 is now on crates.io — no magnus patch is needed.
[patch.crates-io]
rb-sys = { git = "https://github.com/oxidize-rb/rb-sys.git", rev = "daa12b6521a0c442a705d7f9a929029119aab1d6" }

# Exact source candidate for cross-repository compatibility validation.
# Replace with the published crate and registry lock before merging.
parsanol = { git = "https://github.com/parsanol/parsanol-rs.git", rev = "830f97ec9adf2c2b5c80c29d4fc047fe1c4df16e" }
