[package]
name = "parsanol_cdylib"
version = "1.3.52"
edition = "2021"
description = "Vendored cdylib for parsanol platform gems: the pure-portable C ABI (no magnus) for the ffi tier"
license = "MIT"
publish = false

[lib]
name = "parsanol"
crate-type = ["cdylib"]
doc = false

[dependencies]
# 0.15.0 carries the Constant and Lookbehind atoms
parsanol = { version = "0.15.0" }
